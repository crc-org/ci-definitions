name: snc-runner-pusher

on:
  workflow_run:
    workflows: snc-runner-builder
    types:
      - completed
  
jobs:
  push:
    name: push
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'pull_request')
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download snc-runner assets
        id: download-gh-context-artifact
        uses: actions/download-artifact@v4
        with:
          name: snc-runner
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate snc-runner image metadata
        id: metadata
        env:
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          if os.environ["SOURCE_EVENT"] == "pull_request":
              pr_number = os.environ["PR_NUMBER"]
              if not re.fullmatch(r"[1-9][0-9]*", pr_number):
                  raise SystemExit("Missing or invalid pull request number")
              image = f"ghcr.io/crc-org/ci-snc-runner:pr-{pr_number}"
          else:
              image = Path("snc-runner-image").read_text().strip()
              if not re.fullmatch(
                  r"quay\.io/crc-org/ci-snc-runner:v[0-9A-Za-z][0-9A-Za-z._-]*",
                  image,
              ):
                  raise SystemExit("Unexpected snc-runner image reference")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image={image}\n")
          PY

      - name: Log in to ghcr.io for pull requests
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to quay.io
        if: ${{ github.event.workflow_run.event == 'push' }}
        uses: redhat-actions/podman-login@v1
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Push snc-runner
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          podman load -i snc-runner.tar
          podman push "${IMAGE}"

      - name: Download snc-runner-tkn assets
        uses: actions/download-artifact@v4
        with:
          name: snc-runner-tkn
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Push snc-runner-tkn
        env:
          TKN_VERSION: '0.37.0'
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          curl -LO "https://github.com/tektoncd/cli/releases/download/v${TKN_VERSION}/tkn_${TKN_VERSION}_Linux_x86_64.tar.gz"
          tar xvzf "tkn_${TKN_VERSION}_Linux_x86_64.tar.gz" tkn
          ./tkn bundle push "${IMAGE}-tkn" \
            -f task.yaml \
            -f pipeline.yaml
