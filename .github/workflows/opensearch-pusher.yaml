name: opensearch-pusher

on:
  workflow_run:
    workflows: [ 'opensearch-builder' ]
    types:
      - completed
  
jobs:
  push:
    name: push
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'pull_request')
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download opensearch assets
        uses: actions/download-artifact@v4
        with:
          name: opensearch
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate opensearch image metadata
        id: metadata
        env:
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          if os.environ["SOURCE_EVENT"] == "pull_request":
              pr_number = os.environ["PR_NUMBER"]
              if not re.fullmatch(r"[1-9][0-9]*", pr_number):
                  raise SystemExit("Missing or invalid pull request number")
              image = f"ghcr.io/crc-org/ci-opensearch:pr-{pr_number}"
          else:
              image = Path("opensearch-image").read_text().strip()
              if not re.fullmatch(
                  r"quay\.io/crc-org/opensearch:v[0-9A-Za-z][0-9A-Za-z._-]*",
                  image,
              ):
                  raise SystemExit("Unexpected opensearch image reference")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image={image}\n")
          PY

      - name: Log in to ghcr.io for pull requests
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to quay.io
        if: ${{ github.event.workflow_run.event == 'push' }}
        uses: redhat-actions/podman-login@v1
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Push opensearch image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          # Load 
          podman load -i opensearch.tar 
          # Push
          podman push "${IMAGE}"
