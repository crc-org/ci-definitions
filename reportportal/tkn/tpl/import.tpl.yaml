---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: reportportal-import
  labels:
    app.kubernetes.io/version: "cversion"
  annotations:
    tekton.dev/pipelines.minVersion: "0.24.x"
    tekton.dev/categories: data
    tekton.dev/tags: "data, results"
    tekton.dev/displayName: "report portal import"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: |
    Task to import junit results into report portal
  
  params:
  - name: secret-reportportal
    description: |
      ocp secret holding the report portal credentials. Secret should be accessible to this task.
      The default 'none' disables the import.

      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: XXX
      type: Opaque
      data:
        token: XXXX
        url: XXXX
        project: XXXX
    default: 'none'
  - name: pvc
    description: The persistentVolumeClaim name that contains the xml file to be imported to reportportal
    default: pipelines-data
  - name: results-id
    description: Identifier for the results. Typically will include metadata about the environment or the product
  - name: results-wsstorage-path
    description: path within the storage workspace for the results file to be uploaded
  - name: launch-attributes
    description: |
      The attributes for the launch, will show as tag in reportportal. 
      The value format is 
      {"attributes": [{"key":"crc-version","value":"20240926"}, {"key":"bundle-version","value":"4.17.0-rc.5"}]}
  - name: launch-description
    description: The description for the launch.
    default: nightly-run
  # Control
  - name: debug
    description: debug the task cmds
    default: 'false' 
  - name: upload-log
    default: 'true'
    description: |
      whether upload the current pipelinerun logs. 
      If true, the task will gather current pipeline-run logs to xml, then upload to reportportal.
      So recommend put this task in Final block of pipeline. 
  - name: pipelinerunName
    default: $(context.pipelineRun.name)
    description: the pipelinerun name which log be uploaded to reportportal 
  - name: remove-PVC-folder
    default: 'true'
    description: Remove the folder in PVC after import to reportportal
  - name: secret-reportportal-secondary
    description: |
      ocp secret holding the secondary report portal credentials. Secret should be accessible to this task.
      When set, the results are also imported to the secondary report portal.
      The default 'none' disables the secondary import.

      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: XXX
      type: Opaque
      data:
        token: XXXX
        url: XXXX
        project: XXXX
    default: 'none'

  steps:
  - name: import
    image: cimage:cversion #v0.0.5
    imagePullPolicy: Always
    volumeMounts:
      - name: reportportal-credentials
        mountPath: /opt/reportportal-credentials
      - name: reportportal-secondary-credentials
        mountPath: /opt/reportportal-secondary-credentials
      - name: storage
        mountPath: /opt/storage
    script: |
      #!/bin/sh

      # Function to mask credentials (show first and last char, hide middle)
      mask_credential() {
        local cred="$1"
        local len=${#cred}
        if [ $len -le 2 ]; then
          echo "***"
        else
          echo "${cred:0:1}***${cred: -1}"
        fi
      }

      # Print masked ReportPortal credentials, $1 is the folder holding the
      # reportportal credentials, $2 the push name (primary or secondary).
      print_credentials() {
        local url token project
        if [ ! -f "$1/url" ]; then
          echo "ReportPortal $2 credentials not defined"
          return 0
        fi
        url=$(cat "$1/url")
        token=$(cat "$1/token")
        project=$(cat "$1/project")
        echo "ReportPortal $2 credentials (masked):"
        echo "  url=${url}"
        echo "  project=${project}"
        echo "  token=$(mask_credential "$token")"
      }

      # If debug add verbosity. Credentials are read before 'set -x' is
      # enabled so their values are not leaked by the shell trace.
      if [[ $(params.debug) == "true" ]]; then
        print_credentials /opt/reportportal-credentials primary
        print_credentials /opt/reportportal-secondary-credentials secondary
        set -exuo pipefail
      fi

      failFlag='false'
      
      # remove the xml file if its size is 0 byte
      ws_path="/opt/storage/$(params.results-wsstorage-path)"
      find "$ws_path" -type f -name "*.xml" -size 0 -exec rm {} \;
      # Prepare results
      if find "$ws_path" -maxdepth 1 -name "*.xml" -print -quit 2>/dev/null | grep -q .; then
        cp /opt/storage/$(params.results-wsstorage-path)/*.xml .
      else
        failFlag='true'
      fi

      if [[ $(params.upload-log) == 'true' ]]; then
        echo $(params.pipelinerunName)
        tkn pipelinerun list | grep $(params.pipelinerunName)
        if [[ $? == 0 ]]; then
          xmlPath=pipelineLog.xml
          child_references=$(tkn pipelinerun describe $(params.pipelinerunName) -o json | jq -r '.status.childReferences[].name')
          testcases_json='{}'
          for child_reference in $child_references; do
            taskrun_status=$(tkn taskrun describe $child_reference -o json | jq -r '.status.conditions[].status')
            if [[ $taskrun_status == 'Unknown' ]]; then
              continue
            fi
            tkn taskrun logs $child_reference > task_logs.txt
            testcases_json=$(echo "$testcases_json" | jq --arg name "$child_reference" --arg status "$taskrun_status" --rawfile logs task_logs.txt '. + {($name): {"status": $status, "logs": $logs}}')
          done
          echo "$testcases_json" > payload.json
          python3 /create-junit-file.py payload.json $xmlPath $failFlag
          ls -lh
        else
          echo "no pipelinerun $(params.pipelinerunName) found"
        fi
      fi

      # Compress
      if [[ $failFlag == 'true' ]]; then
        fileName="fail-pipelinerun"
      else
        fileName=$(params.results-id)
      fi

      zip "$fileName.zip" *.xml
      description=""
      if [[ $failFlag != 'true' ]]; then
        description="$(params.launch-description)"
      else
        description="$(params.results-id)"
      fi

      # Import, $1 is the folder holding the reportportal credentials, $2 the push name (primary or secondary)
      import_launch() {
        if [ ! -f "$1/url" ]; then
          echo "Skipping reportportal import, credentials not available for $2 push"
          return 0
        fi
        # Do not expose secret values in xtrace output. Restore tracing after
        # all credential-dependent commands have completed.
        local xtrace_enabled=false
        case "$-" in
          *x*) xtrace_enabled=true; set +x ;;
        esac
        echo "Importing results to reportportal for $2 push"
        url=$(cat "$1/url")
        token=$(cat "$1/token")
        project=$(cat "$1/project")
        upload=`curl -k -X POST "${url}/api/v1/plugin/${project}/junit/import" \
            -H "accept: */*" -H "Content-Type: multipart/form-data" \
            -H "Authorization: bearer ${token}" \
            -F "file=@$fileName.zip" \
            -F "launchImportRq={
              \"attributes\": [
                {
                  \"key\": \"skippedIsNotIssue\",
                  \"system\": true,
                  \"value\": \"true\"
                }
              ],
              \"description\": \"${description}\"
            };type=application/json"`
        uuid=${upload#*\"id\":\"}
        uuid=${uuid%%\"*}
        getid=`curl -k -X GET "${url}/api/v1/${project}/launch/uuid/${uuid}" \
            -H "accept: */*" -H  "Authorization: bearer ${token}"`
        launchId=`echo $getid | jq .id`
        if [[ $failFlag != 'true' ]]; then
          curl -k -X PUT "${url}/api/v1/${project}/launch/${launchId}/update" \
              -H "accept: */*" -H "Content-Type: application/json" \
              -H "Authorization: bearer ${token}" \
              -d '$(params.launch-attributes)'
        fi
        if [ "$xtrace_enabled" = true ]; then
          set -x
        fi
      }

      import_launch /opt/reportportal-credentials primary
      import_launch /opt/reportportal-secondary-credentials secondary

      # delete the folder in pvc
      if [[ $(params.remove-PVC-folder) == "true" ]]; then
        path=$(params.results-wsstorage-path)
        IFS='/' read -ra folder <<< "$path"
        if [ -d "/opt/storage/$folder" ]; then
          ls /opt/storage/$folder
          rm -r /opt/storage/$folder
        fi
      fi

    resources:      
      requests:
        memory: "150Mi"
        cpu: "50m"
      limits:
        memory: "400Mi"
        cpu: "100m"

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: $(params.pvc)
    - name: reportportal-credentials
      secret:
        secretName: $(params.secret-reportportal)
        optional: true
    - name: reportportal-secondary-credentials
      secret:
        secretName: $(params.secret-reportportal-secondary)
        optional: true
