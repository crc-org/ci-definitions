---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: reportportal-import
  labels:
    app.kubernetes.io/version: "v1.0.0"
  annotations:
    tekton.dev/pipelines.minVersion: "0.24.x"
    tekton.dev/categories: data
    tekton.dev/tags: "data, results"
    tekton.dev/displayName: "report portal import"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: |
    Task to import junit results into report portal
  
  params:
  - name: secret-reportportal
    description: |
      ocp secret holding the report portal credentials. Secret should be accessible to this task.

      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: XXX
      type: Opaque
      data:
        token: XXXX
        url: XXXX
        project: XXXX
    default: reportportal-crc
  - name: pvc
    description: The persistentVolumeClaim name that contains the xml file to be imported to reportportal
    default: pipelines-data
  - name: results-id
    description: Identifier for the results. Typically will include metadata about the environment or the product
  - name: results-wsstorage-path
    description: path within the storage workspace for the results file to be uploaded
  - name: launch-attributes
    description: |
      The attributes for the launch, will show as tag in reportportal. 
      The value format is 
      {"attributes": [{"key":"crc-version","value":"20240926"}, {"key":"bundle-version","value":"4.17.0-rc.5"}]}
  - name: launch-description
    description: The description for the launch.
    default: nightly-run
  # Control
  - name: debug
    description: debug the task cmds
    default: 'false' 
  - name: upload-log
    default: 'true'
    description: |
      whether upload the current pipelinerun logs. 
      If true, the task will gather current pipeline-run logs to xml, then upload to reportportal.
      So recommend put this task in Final block of pipeline. 
  - name: pipelinerunName
    default: $(context.pipelineRun.name)
    description: the pipelinerun name which log be uploaded to reportportal 
  - name: remove-PVC-folder
    default: 'true'
    description: Remove the folder in PVC on exit, including when an import fails
  - name: secret-reportportal-secondary
    default: reportportal-crc-secondary
    description: Optional secondary credentials secret. An absent or empty secret skips the secondary import; a nonempty secret must contain url, token, and project.

  steps:
  - name: import
    image: quay.io/crc-org/reportportal:v1.0.0 #v0.0.5
    imagePullPolicy: Always
    workingDir: /tmp
    volumeMounts:
      - name: reportportal-credentials
        mountPath: /opt/reportportal-credentials
      - name: reportportal-secondary-credentials
        mountPath: /opt/reportportal-secondary-credentials
        readOnly: true
      - name: storage
        mountPath: /opt/storage
    script: |
      #!/usr/bin/env bash

      # Never enable shell tracing here: curl arguments contain the API token.
      if [[ $(params.debug) == "true" ]]; then
        echo "ReportPortal import debug mode enabled"
      fi

      # Always clean up on exit, including failed imports, unless retention is requested.
      cleanup_results() {
        local import_status=$?
        trap - EXIT
        if [[ $(params.remove-PVC-folder) == "true" ]]; then
          local path="$(params.results-wsstorage-path)"
          local folder=${path%%/*}
          if [[ -z "$folder" || "$folder" == "." || "$folder" == ".." ]]; then
            echo "Unsafe results-wsstorage-path: $path" >&2
            exit 1
          fi
          if [[ -d "/opt/storage/$folder" ]]; then
            rm -r -- "/opt/storage/$folder" || exit 1
          fi
        fi
        exit "$import_status"
      }
      trap cleanup_results EXIT

      failFlag='false'
      
      # remove the xml file if its size is 0 byte
      ws_path="/opt/storage/$(params.results-wsstorage-path)"
      find "$ws_path" -type f -name "*.xml" -size 0 -exec rm {} \;
      # Prepare results
      if find "$ws_path" -maxdepth 1 -name "*.xml" -print -quit 2>/dev/null | grep -q .; then
        cp /opt/storage/$(params.results-wsstorage-path)/*.xml .
      else
        failFlag='true'
      fi

      if [[ $(params.upload-log) == 'true' ]]; then
        echo $(params.pipelinerunName)
        tkn pipelinerun list | grep $(params.pipelinerunName)
        if [[ $? == 0 ]]; then
          xmlPath=pipelineLog.xml
          child_references=$(tkn pipelinerun describe $(params.pipelinerunName) -o json | jq -r '.status.childReferences[].name')
          testcases_json='{}'
          for child_reference in $child_references; do
            taskrun_status=$(tkn taskrun describe $child_reference -o json | jq -r '.status.conditions[].status')
            if [[ $taskrun_status == 'Unknown' ]]; then
              continue
            fi
            tkn taskrun logs $child_reference > task_logs.txt
            testcases_json=$(echo "$testcases_json" | jq --arg name "$child_reference" --arg status "$taskrun_status" --rawfile logs task_logs.txt '. + {($name): {"status": $status, "logs": $logs}}')
          done
          echo "$testcases_json" > payload.json
          python3 /create-junit-file.py payload.json $xmlPath $failFlag
          ls -lh
        else
          echo "no pipelinerun $(params.pipelinerunName) found"
        fi
      fi

      # Compress
      if [[ $failFlag == 'true' ]]; then
        fileName="fail-pipelinerun"
      else
        fileName=$(params.results-id)
      fi

      zip "$fileName.zip" *.xml || exit 1
      description=""
      if [[ $failFlag != 'true' ]]; then
        description="$(params.launch-description)"
      else
        description="$(params.results-id)"
      fi
      launch_request=$(jq -n --arg description "$description" \
        '{attributes:[{key:"skippedIsNotIssue",system:true,value:"true"}],description:$description}')

      import_launch() {
        local credentials_dir="$1" target="$2"
        local key url token project upload uuid launch_id
        for key in url token project; do
          if [[ ! -s "$credentials_dir/$key" ]]; then
            echo "$target ReportPortal credentials are missing the $key key" >&2
            return 1
          fi
        done
        url=$(cat "$credentials_dir/url")
        token=$(cat "$credentials_dir/token")
        project=$(cat "$credentials_dir/project")
        url=${url%/}

        upload=$(curl -kfsS -X POST "$url/api/v1/plugin/$project/junit/import" \
          -H "accept: application/json" \
          -H "Authorization: bearer $token" \
          -F "file=@$fileName.zip" \
          -F "launchImportRq=$launch_request;type=application/json") || return 1
        uuid=$(printf '%s' "$upload" | jq -er '.data.id // .id') || return 1
        launch_id=$(curl -kfsS -X GET "$url/api/v1/$project/launch/uuid/$uuid" \
          -H "Authorization: bearer $token" | jq -er '.id') || return 1
        if [[ $failFlag != 'true' ]]; then
          curl -kfsS -X PUT "$url/api/v1/$project/launch/$launch_id/update" \
            -H "Content-Type: application/json" \
            -H "Authorization: bearer $token" \
            -d '$(params.launch-attributes)' > /dev/null || return 1
        fi
        echo "Imported $target ReportPortal launch $launch_id"
      }

      import_status=0
      import_launch /opt/reportportal-credentials primary || import_status=1
      secondary_credentials_dir=/opt/reportportal-secondary-credentials
      if compgen -G "$secondary_credentials_dir/*" > /dev/null; then
        import_launch "$secondary_credentials_dir" secondary || import_status=1
      else
        echo "Secondary ReportPortal secret is absent or empty; skipping import."
      fi
      exit "$import_status"

    resources:      
      requests:
        memory: "100Mi"
        cpu: "50m"
      limits:
        memory: "200Mi"
        cpu: "100m"

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: $(params.pvc)
    - name: reportportal-credentials
      secret:
        secretName: $(params.secret-reportportal)
    - name: reportportal-secondary-credentials
      secret:
        secretName: $(params.secret-reportportal-secondary)
        optional: true
